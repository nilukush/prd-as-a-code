name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Vitest 5 requires Node 20.12+ (util.styleText); Node 18 gets the
      # CLI-only smoke job below.
      matrix:
        node: [20, 22, 24]
    env:
      # Install the playwright module only; CI exercises the browser-missing
      # guidance path. The real-render test detects the missing browser and
      # skips itself. Browsers are not downloaded to keep CI fast.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo

  cli-smoke-node-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run demo
