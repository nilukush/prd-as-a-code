# Publishes prdc to the public npm registry using trusted publishing (OIDC).
# No npm tokens exist anywhere in this repo: npmjs.com holds the trusted
# publisher configuration bound to THIS file's name (publish.yml).
# Under npm staged publishing the version may land in an approval queue;
# a maintainer approves it on npmjs.com with 2FA before it goes live.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  # Required: lets this job request the OIDC token npm uses for authentication.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Module only, no browsers: keeps the publish run fast; the pdf
      # real-render test skips itself without a browser.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      # stage publish needs a recent npm; runners can bundle an older one.
      - run: npm install -g npm@latest
      # Stages the version for 2FA maintainer approval on npmjs.com instead of
      # publishing directly (the trusted publisher has no "allow npm publish").
      - run: npm stage publish
